<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tham Quan Hệ Sinh Thái Biển 360°</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        /* Nút bấm yêu cầu quyền cảm biến bắt buộc cho thiết bị di động */
        #vr-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            padding: 15px 30px;
            background-color: #0077b6;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #instruction {
            position: fixed;
            top: 20px;
            width: 100%;
            text-align: center;
            color: white;
            z-index: 9999;
            font-size: 16px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="instruction">Xoay điện thoại hoặc vuốt màn hình để nhìn xung quanh 360°</div>
    <button id="vr-btn">BẬT CẢM BIẾN & XEM VIDEO</button>

    <a-scene loading-screen="enabled: false">
        <a-assets>
            <video id="underwater-video" 
                   src="video360.mp4" 
                   preload="auto"
                   loop="true" 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-entity camera look-controls="magicWindowTrackingEnabled: true; touchEnabled: true"></a-entity>

        <a-videosphere src="#underwater-video" rotation="0 -90 0"></a-videosphere>
    </a-scene>

    <script>
        const playButton = document.getElementById('vr-btn');
        const videoElement = document.getElementById('underwater-video');

        playButton.addEventListener('click', function() {
            // Kích hoạt phát video ngay khi người dùng tương tác ấn nút
            videoElement.play().then(() => {
                console.log("Video đang phát thành công!");
            }).catch(function(error) {
                console.log("Lỗi phát video: ", error);
            });

            // Yêu cầu quyền cảm biến chuyển động đối với iPhone (iOS 13 trở lên)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            playButton.style.display = 'none'; // Cấp quyền thành công, ẩn nút
                        } else {
                            alert('Bạn cần cho phép quyền cảm biến chuyển động để xoay được góc nhìn!');
                        }
                    })
                    .catch(console.error);
            } else {
                // Với Android hoặc máy tính, cảm biến tự động chạy nên ẩn nút kích hoạt ngay
                playButton.style.display = 'none';
            }
        });
    </script>
</body>
</html>
